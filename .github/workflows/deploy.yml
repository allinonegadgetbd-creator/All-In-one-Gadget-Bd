name: Build and Deploy All In One Gadget

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Verify, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Verify server entry syntax
        run: node --experimental-strip-types --check server.ts

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-in-one-gadget-dist
          path: |
            dist/
            server.ts
            server/
            public/
            package.json
          retention-days: 14

      - name: Trigger Auto-Deploy Webhook (Render / Railway / Custom Host)
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL"
